name: Docs Preview Artifact

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create artifact bundle
        run: |
          mkdir -p preview
          cp -R docs preview/docs
          cp README.md preview/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: preview
